[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cts_cm"
version = "0.1.0"
description = "Counterfactual Trajectory Shifting via Causal Mediation for population-scale knee osteoarthritis risk-trajectory analysis"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
keywords = ["causal-inference", "osteoarthritis", "trajectory-modelling", "mediation", "double-machine-learning"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "cyclopts>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.3",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
cts-cm = "cts_cm.observer.__main__:main"

[tool.setuptools.packages.find]
include = ["cts_cm*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["cts_cm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["cts_cm"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["cts_cm"]
plugins = []

[[tool.mypy.overrides]]
module = ["xgboost.*", "sklearn.*", "statsmodels.*", "cyclopts.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
